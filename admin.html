<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ダッシュボード - スマート打刻システム</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-section {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .admin-section h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 5px;
            display: inline-block;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .form-row > div {
            flex: 1;
            min-width: 150px;
        }
        .form-row input, .form-row select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.8);
        }
        .table-container {
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }
        th {
            background: rgba(0, 0, 0, 0.03);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
        }
        tr:last-child td {
            border-bottom: none;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-danger:hover { background: #dc2626; }
        .btn-success {
            background: #10b981;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-success:hover { background: #059669; }
        
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .modal h3 {
            margin-top: 0; margin-bottom: 15px;
        }

        /* ダッシュボード用カードスタイル */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: left;
        }
        .card-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .card-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-blue);
        }
        
        /* カスタムヘッダー */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 20px;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container glass-panel" style="max-width: 950px; padding: 30px; width: 95%;">
        
        <div class="admin-header">
            <div>
                <h1 style="font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px;">⚙️ 管理ダッシュボード</h1>
                <p class="subtitle" style="text-align: left; margin: 0;">集計・打刻・システム設定の総合管理</p>
            </div>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <label style="font-size: 14px; font-weight: bold; color: var(--text-secondary);">対象月:</label>
                <select id="month-select" class="custom-select" style="padding: 8px 15px; font-size: 14px; width: 140px; border: 2px solid #e2e8f0; border-radius: 8px; background: rgba(255,255,255,0.8);">
                    <!-- JavaScriptで動的に生成 -->
                </select>
            </div>
        </div>

        <!-- メインコンテンツ (認証後に表示) -->
        <main id="admin-content" class="hidden">
            
            <!-- 月次集計サマリーセクション -->
            <div class="admin-section">
                <h3>📊 月次集計サマリー</h3>
                <div class="summary-cards" id="summary-cards">
                    <div class="card">
                        <div class="card-title">今月の所定営業時間</div>
                        <div class="card-value" id="standard-hours">--時間--分</div>
                    </div>
                    <div class="card">
                        <div class="card-title">全従業員 実労働時間</div>
                        <div class="card-value" id="total-hours">--時間--分</div>
                    </div>
                    <div class="card">
                        <div class="card-title">稼働人数</div>
                        <div class="card-value" id="total-users">--人</div>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ユーザー名</th>
                                <th>出勤日数</th>
                                <th>総滞在時間</th>
                                <th>実労働時間</th>
                                <th>残業時間</th>
                            </tr>
                        </thead>
                        <tbody id="aggregation-tbody">
                            <tr>
                                <td colspan="4" style="text-align: center;">データを読み込んでいます...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 打刻履歴管理セクション -->
            <div class="admin-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin-bottom: 0;">🕒 打刻履歴の管理</h3>
                    <button id="btn-open-add-log" class="btn btn-success" style="padding: 8px 15px; font-size: 14px; height: auto;">＋ 手動追加</button>
                </div>

                <div class="table-container">
                    <table style="font-size: 14px;">
                        <thead>
                            <tr>
                                <th>打刻日時</th>
                                <th>氏名</th>
                                <th>種類</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="log-tbody">
                            <tr><td colspan="4" style="text-align: center;">データを読み込んでいます...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 従業員管理セクション -->
            <div class="admin-section">
                <h3>👥 従業員管理</h3>
                <div class="form-row">
                    <div>
                        <label style="font-size: 0.85rem; color: var(--text-secondary);">ユーザーID (半角英数)</label>
                        <input type="text" id="new-user-id" placeholder="user001">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; color: var(--text-secondary);">氏名</label>
                        <input type="text" id="new-user-name" placeholder="山田 太郎">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; color: var(--text-secondary);">休憩時間 (分)</label>
                        <input type="number" id="new-user-break" placeholder="60">
                    </div>
                    <button id="btn-add-user" class="btn btn-primary" style="padding: 10px 20px; height: 42px;">追加 / 更新</button>
                </div>

                <div class="table-container">
                    <table style="font-size: 14px;">
                        <thead>
                            <tr>
                                <th>ユーザーID</th>
                                <th>氏名</th>
                                <th>休憩時間</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="user-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- システム設定セクション -->
            <div class="admin-section">
                <h3>🔧 システム設定</h3>
                <div class="form-group">
                    <label>管理者パスワード</label>
                    <input type="text" id="setting-password" class="custom-select" style="margin-bottom: 15px;">
                    <label>月次レポート送信先メールアドレス</label>
                    <input type="email" id="setting-email" class="custom-select" style="margin-bottom: 15px;">
                </div>
                <button id="btn-save-settings" class="btn btn-primary" style="padding: 10px 20px; font-size: 14px;">設定を保存</button>
            </div>
            
        </main>
        
        <footer>
            <div class="footer-links" style="margin-top: 20px;">
                <a href="index.html" class="link-btn" style="display: inline-block; margin-bottom: 10px;">🔙 打刻画面へ戻る</a>
            </div>
        </footer>
    </div>

    <!-- 認証用オーバーレイ -->
    <div id="password-overlay" class="overlay">
        <div class="glass-panel" style="padding: 30px; border-radius: 16px; text-align: center; max-width: 350px; width: 90%;">
            <h2 style="margin-bottom: 20px; font-size: 20px;">🔒 認証が必要です</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: var(--text-secondary);">管理用パスワードを入力してください</p>
            <input type="password" id="admin-password" placeholder="パスワード" class="custom-select" style="margin-bottom: 15px; text-align: center;">
            <button id="btn-login" class="btn btn-primary" style="width: 100%;">ログイン</button>
            <p id="password-error" style="color: var(--accent-red); font-size: 12px; margin-top: 10px; min-height: 15px;"></p>
        </div>
    </div>

    <!-- 打刻修正モーダル -->
    <div id="edit-log-modal" class="modal hidden">
        <div class="modal-content">
            <h3>打刻の修正</h3>
            <input type="hidden" id="edit-log-row">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">打刻日時</label>
                <input type="datetime-local" id="edit-log-time" class="custom-select" style="width: 100%; padding: 10px;">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">打刻種類</label>
                <select id="edit-log-type" class="custom-select" style="width: 100%; padding: 10px;">
                    <option value="出勤">出勤</option>
                    <option value="退勤">退勤</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btn-save-log-edit" class="btn btn-primary" style="flex: 1; padding: 10px;">保存</button>
                <button onclick="document.getElementById('edit-log-modal').classList.add('hidden')" class="btn btn-small" style="flex: 1; background: #e2e8f0; color: #333;">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 打刻手動追加モーダル -->
    <div id="add-log-modal" class="modal hidden">
        <div class="modal-content">
            <h3>打刻の手動追加</h3>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">ユーザー</label>
                <select id="add-log-user" class="custom-select" style="width: 100%; padding: 10px;">
                    <!-- JSで生成 -->
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">打刻日時</label>
                <input type="datetime-local" id="add-log-time" class="custom-select" style="width: 100%; padding: 10px;">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">打刻種類</label>
                <select id="add-log-type" class="custom-select" style="width: 100%; padding: 10px;">
                    <option value="出勤">出勤</option>
                    <option value="退勤">退勤</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btn-save-new-log" class="btn btn-success" style="flex: 1; padding: 10px;">追加</button>
                <button onclick="document.getElementById('add-log-modal').classList.add('hidden')" class="btn btn-small" style="flex: 1; background: #e2e8f0; color: #333;">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- ローディングオーバーレイ -->
    <div id="loading-overlay" class="overlay hidden">
        <div class="spinner"></div>
        <p>通信中...</p>
    </div>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
