<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 - スマート打刻システム</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-section {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .admin-section h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 5px;
            display: inline-block;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: flex-end;
        }
        .form-row input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        .table-container {
            overflow-x: auto;
        }
        .btn-small {
            padding: 5px 10px;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="glass-container" style="max-width: 800px;">
        <div class="header">
            <h1 class="title">⚙️ システム管理画面</h1>
            <p class="subtitle">従業員設定とシステム設定</p>
        </div>

        <!-- 認証用オーバーレイ -->
        <div id="password-overlay" class="password-overlay">
            <div class="password-box">
                <h2>認証が必要です</h2>
                <p>管理パスワードを入力してください</p>
                <input type="password" id="admin-password" placeholder="パスワード" class="custom-select" style="margin-bottom: 15px;">
                <button id="btn-login" class="btn btn-primary" style="width: 100%;">ログイン</button>
                <p id="password-error" class="status-message status-error" style="display: block; margin-top: 10px;"></p>
            </div>
        </div>

        <!-- ローディングオーバーレイ -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>通信中...</p>
        </div>

        <!-- メインコンテンツ (認証後に表示) -->
        <div id="admin-content" class="hidden">
            
            <!-- システム設定セクション -->
            <div class="admin-section">
                <h3>システム設定</h3>
                <div class="form-group">
                    <label>管理者パスワード</label>
                    <input type="text" id="setting-password" class="custom-select" style="margin-bottom: 10px;">
                    <label>月次レポート送信先メールアドレス</label>
                    <input type="email" id="setting-email" class="custom-select" style="margin-bottom: 10px;">
                </div>
                <button id="btn-save-settings" class="btn btn-primary">設定を保存</button>
            </div>

            <!-- 従業員管理セクション -->
            <div class="admin-section">
                <h3>従業員管理</h3>
                
                <div class="form-row">
                    <div>
                        <label style="font-size: 0.85rem;">ユーザーID (半角英数)</label>
                        <input type="text" id="new-user-id" placeholder="user001">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem;">氏名</label>
                        <input type="text" id="new-user-name" placeholder="山田 太郎">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem;">休憩時間 (分)</label>
                        <input type="number" id="new-user-break" placeholder="60">
                    </div>
                    <button id="btn-add-user" class="btn btn-primary" style="padding: 10px 20px;">追加 / 更新</button>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ユーザーID</th>
                                <th>氏名</th>
                                <th>休憩時間</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="user-tbody">
                            <!-- JSで生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="footer-links" style="margin-top: 20px;">
                <a href="index.html" class="link-btn">🔙 打刻画面へ戻る</a>
                <a href="dashboard.html" class="link-btn" style="margin-left: 10px;">📊 ダッシュボード</a>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
